name: Update dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    name: Update mise tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Update toolchain
        shell: bash
        run: |
          set -euo pipefail

          mise lock \
            --bump \
            --minimum-release-age 3d \
            --platform linux-x64,linux-arm64,macos-x64,macos-arm64

          hk_version="$(mise current hk)"
          if [[ ! "$hk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected hk version: $hk_version" >&2
            exit 1
          fi

          hk_reference='github.com/jdx/hk/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/hk@[0-9]+\.[0-9]+\.[0-9]+'
          if [[ "$(grep -Eoc "$hk_reference" hk.pkl)" -ne 2 ]]; then
            echo "Expected exactly two versioned hk references in hk.pkl" >&2
            exit 1
          fi

          sed -i -E \
            "s#(github.com/jdx/hk/releases/download/)v[0-9]+\.[0-9]+\.[0-9]+(/hk@)[0-9]+\.[0-9]+\.[0-9]+#\1v${hk_version}\2${hk_version}#g" \
            hk.pkl

          mise install --locked
          mise run check

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            hk.pkl
            mise.lock
          branch: automation/mise-toolchain
          commit-message: "chore(deps): update mise toolchain"
          delete-branch: true
          title: "chore(deps): update mise toolchain"
          body: |
            Update the locked mise development tools and synchronize the hk configuration package version.
