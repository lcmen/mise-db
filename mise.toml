[tools]
"aqua:Kampfkarren/selene" = "latest"
hk = "latest"
shellcheck = "latest"
stylua = "latest"

[tasks.check]
description = "Run hk checks on all files"
run = "hk check --all"

[tasks.fix]
description = "Run hk fixes on all files"
run = "hk fix --all --no-stage"

[tasks.hooks]
description = "Install hk git hooks through mise"
run = "hk install --mise"

[tasks.pre-commit]
description = "Run hk pre-commit hook"
run = "hk run pre-commit"

[tasks.test]
description = "Run binary plugin smoke tests"
depends = ["test:mysql", "test:postgres", "test:valkey"]

[tasks."test:mysql"]
description = "Run the MySQL binary smoke test"
run = "tests/mysql.test.sh"

[tasks."test:postgres"]
description = "Run the PostgreSQL binary smoke test"
run = "tests/postgres.test.sh"

[tasks."test:valkey"]
description = "Run the Valkey binary smoke test"
run = "tests/valkey.test.sh"
